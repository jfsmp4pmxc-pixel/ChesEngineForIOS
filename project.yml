name: ChessEngine
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ChessEngine:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/nets"
      - path: App/Resources/nets
        type: folder
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Chess Engine
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChessEngine
        PRODUCT_NAME: ChessEngine
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/ChessEngine-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/bridge"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/lib"
        OTHER_LDFLAGS: "-lstockfish -lc++"
        ENABLE_BITCODE: NO
